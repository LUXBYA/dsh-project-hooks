- insert:
    - id: project-hooks
      name: 'dsh-project-hooks'
      config:
        enabled: true
        blockTools: true
        defaultTimeoutMs: 600000
        # 注入正文最多多少字
        contextLimit: 2400
        # 运行日志：是否记输出明细 / 条数上限 / 体积上限（字节）/ 单段输出上限（字）
        captureOutput: true
        runsKeep: 2000
        runsMaxBytes: 5242880
        outputLimit: 4000
        # 每一步实际发给模型的 messages 也记一份快照（只记已识别项目的会话）
        logRequests: true
        requestItemLimit: 600
